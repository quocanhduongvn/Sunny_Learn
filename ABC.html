<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bé Học Bảng Chữ Cái A-Z Cùng Gấu Trúc 🐼 - Sunny Panda</title>
    <link rel="stylesheet" href="css/app.css">
    <style>
        .abc-board {
            max-width: 900px;
            margin: 0 auto 50px auto;
            padding: 0 15px;
        }

        .abc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .abc-tile {
            background: #FFFFFF;
            border-radius: 20px;
            border: 3px solid #E2E8F0;
            box-shadow: 0 6px 0 #CBD5E1;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .abc-tile:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0 #CBD5E1;
        }

        .abc-tile:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #CBD5E1;
        }

        .abc-letter-big {
            font-size: 2.2rem;
            font-weight: 900;
            color: #2D3436;
        }

        .abc-emoji {
            font-size: 2rem;
            margin: 4px 0;
        }

        .abc-word {
            font-size: 0.85rem;
            font-weight: 800;
            color: #718096;
        }

        .active-letter-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .active-letter-card {
            background: white;
            border-radius: 30px;
            padding: 30px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>

<body>

    <header class="app-navbar">
        <a href="index.html" class="brand-badge" style="text-decoration:none;">
            <div class="brand-logo-icon">🐼</div>
            <div class="brand-text">
                <h1>Bảng Chữ Cái A-Z</h1>
                <span>Bé Học Phonics Vui Nhộn</span>
            </div>
        </a>

        <div class="nav-actions">
            <a href="index.html" class="btn-header" style="text-decoration:none;">
                🏠 Về Trang Chủ
            </a>
        </div>
    </header>

    <audio id="masterAudio" preload="auto"></audio>

    <div class="abc-board">
        <div style="text-align:center; margin: 20px 0;">
            <h2 style="font-size: 1.8rem; margin-bottom: 5px; color: #2D3436;">Chạm vào chữ cái để nghe phát âm nha bé! 🔤</h2>
            <p style="color: #718096; font-weight: 700;">Gấu Trúc Sunny sẽ cùng bé luyện đọc chữ cái và từ vựng tương ứng</p>
        </div>

        <div class="abc-grid" id="abc-grid"></div>
    </div>

    <!-- Letter Popup Modal -->
    <div class="active-letter-modal" id="letter-modal" onclick="closeLetterModal(event)">
        <div class="active-letter-card" onclick="event.stopPropagation()">
            <div id="modal-letter" onclick="speakCurrentLetter()" style="font-size: 5rem; font-weight: 900; color: #1E90FF; cursor: pointer;" title="Chạm để nghe đọc chữ cái">Aa 🔊</div>
            <div id="modal-emoji" onclick="speakCurrentLetter()" style="font-size: 4rem; margin: 10px 0; cursor: pointer;">🍎</div>
            <div id="modal-word-en" onclick="speakCurrentLetter()" style="font-size: 2.2rem; font-weight: 900; color: #2D3436; cursor: pointer;" title="Chạm để nghe tiếng Anh">Apple 🔊</div>
            <div id="modal-word-vn" onclick="speakCurrentWordVn()" style="font-size: 1.3rem; font-weight: 700; color: #00B894; margin-bottom: 15px; cursor: pointer;" title="Chạm để nghe tiếng Việt">Quả Táo 🇻🇳</div>
            <div id="modal-hint" style="font-size: 1rem; font-weight: 600; color: #718096; margin-bottom: 20px;">A says /æ/ like Apple</div>

            <div style="display:flex; gap:10px; justify-content:center; flex-wrap: wrap;">
                <button class="btn-voice-en" onclick="speakCurrentLetter()" title="Nghe chữ cái và từ vựng">
                    🔊 Tiếng Anh
                </button>
                <button class="btn-voice-vn" onclick="speakCurrentWordVn()" style="background:#00b894; color:white; border-radius:25px; padding:10px 18px; font-weight:800; border:none; cursor:pointer;" title="Nghe tiếng Việt">
                    🇻🇳 Tiếng Việt
                </button>
                <button class="btn-modal btn-modal-cancel" onclick="document.getElementById('letter-modal').style.display='none'">
                    Đóng
                </button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/audio.js"></script>
    <script>
        let currentLetterItem = null;

        function renderABCGrid() {
            const grid = document.getElementById('abc-grid');
            if (!grid) return;

            const alphabet = PANDA_DATABASE.alphabet;
            const colors = ['#FF7675', '#74B9FF', '#55EFC4', '#FFEAA7', '#A29BFE', '#FAB1A0', '#FD79A8'];

            let html = '';
            alphabet.forEach((item, idx) => {
                const color = colors[idx % colors.length];
                html += `
                <div class="abc-tile" style="border-top: 6px solid ${color};" onclick="openLetterModal('${item.id}')">
                    <div class="abc-letter-big" style="color: ${color};">${item.letter}${item.letterSmall}</div>
                    <div class="abc-emoji">${item.emoji}</div>
                    <div class="abc-word">${item.en}</div>
                </div>
                `;
            });
            grid.innerHTML = html;
        }

        function openLetterModal(id) {
            const item = PANDA_DATABASE.alphabet.find(x => x.id === id);
            if (!item) return;

            currentLetterItem = item;
            document.getElementById('modal-letter').textContent = `${item.letter} ${item.letterSmall}`;
            document.getElementById('modal-emoji').textContent = item.emoji;
            document.getElementById('modal-word-en').textContent = item.en;
            document.getElementById('modal-word-vn').textContent = item.vn;
            document.getElementById('modal-hint').textContent = item.soundHint || '';

            document.getElementById('letter-modal').style.display = 'flex';
            speakCurrentLetter();
        }

        function speakCurrentLetter() {
            if (!currentLetterItem) return;
            const audio = window.pandaAudio || (typeof pandaAudio !== 'undefined' ? pandaAudio : null);
            if (audio) {
                audio.playSfx('pop');
            }
            
            // Phát âm thanh chữ cái MP3 trước, sau đó phát từ vựng
            const letterAudio = new Audio(`sound/words/letter_${currentLetterItem.id}.mp3`);
            letterAudio.onended = () => {
                setTimeout(() => {
                    playEnglishAudio(currentLetterItem.en);
                }, 250);
            };
            letterAudio.onerror = () => {
                playEnglishAudio(currentLetterItem.en);
            };
            const p = letterAudio.play();
            if (p !== undefined) {
                p.catch(() => {
                    playEnglishAudio(currentLetterItem.en);
                });
            }
        }

        function speakCurrentWordVn() {
            if (!currentLetterItem) return;
            playVietnameseAudio(currentLetterItem.vn);
        }

        function closeLetterModal(e) {
            document.getElementById('letter-modal').style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderABCGrid();
        });
    </script>
</body>

</html>
