<!DOCTYPE html>

<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bé Học Tiếng Anh</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css" />

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #000;
        }

        .swiper {
            height: 100vh;
        }

        .swiper-slide {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        img {
            width: 320px;
            height: 320px;
            border-radius: 20px;
            object-fit: cover;
            border: 5px solid white;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 45px;
            margin: 10px;
        }

        .vn {
            font-size: 26px;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-en {
            background: #2ed573;
            color: white;
        }

        .btn-vn {
            background: #ff4757;
            color: white;
        }
    </style>

</head>

<body>

    <!-- Nút về trang chủ -->
    <a href="index.html" style="position: fixed; top: 20px; left: 20px; background: #3498db; color: white; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; box-shadow: 0 4px #2980b9; z-index: 1000; font-family: Arial, sans-serif;">
        ◀️ Bé Học Số
    </a>

    <audio id="ttsAudio"></audio>
    <div class="swiper">
        <div class="swiper-wrapper" id="slides"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>

    <script>

        const vocab = [

            { vn: "Quả Táo", en: "apple", img: "https://upload.wikimedia.org/wikipedia/commons/1/15/Red_Apple.jpg" },
            { vn: "Con Mèo", en: "cat", img: "https://upload.wikimedia.org/wikipedia/commons/3/3a/Cat03.jpg" },
            { vn: "Quả Chuối", en: "banana", img: "https://upload.wikimedia.org/wikipedia/commons/8/8a/Banana-Single.jpg" },
            { vn: "Con Chó", en: "dog", img: "https://upload.wikimedia.org/wikipedia/commons/6/6e/Golde33443.jpg" },
            { vn: "Con Voi", en: "elephant", img: "https://upload.wikimedia.org/wikipedia/commons/3/37/African_Bush_Elephant.jpg" },
            { vn: "Con Sư Tử", en: "lion", img: "https://upload.wikimedia.org/wikipedia/commons/7/73/Lion_waiting_in_Namibia.jpg" },
            { vn: "Quả Cam", en: "orange", img: "https://upload.wikimedia.org/wikipedia/commons/c/c4/Orange-Fruit-Pieces.jpg" },
            { vn: "Con Cá", en: "fish", img: "https://upload.wikimedia.org/wikipedia/commons/1/17/Clown_fish_in_the_Andaman_Coral_Reef.jpg" },
            { vn: "Con Chim", en: "bird", img: "https://upload.wikimedia.org/wikipedia/commons/5/5c/House_sparrow04.jpg" }

        ]

        const slides = document.getElementById("slides")

        vocab.forEach(word => {

            slides.innerHTML += `

<div class="swiper-slide">

<img src="${word.img}">

<h1>${word.en}</h1>

<div class="vn">${word.vn}</div>

<div>

<button class="btn-en" onclick="speak('${word.en}','en')">🔊 English</button>

<button class="btn-vn" onclick="speak('${word.vn}','vi')">🔊 Tiếng Việt</button>

</div>

</div>

`

        })

        let ttsAudio;

        function speak(text, lang) {
            if (!ttsAudio) ttsAudio = document.getElementById('ttsAudio');
            
            const ttsLang = lang == "en" ? "en-US" : "vi-VN";
            if (ttsAudio) {
                const url = `https://translate.googleapis.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${ttsLang}&q=${encodeURIComponent(text)}`;
                ttsAudio.src = url;
                ttsAudio.play().catch(e => {
                    console.error("Audio play error:", e);
                    fallbackSpeak(text, ttsLang);
                });
            } else {
                fallbackSpeak(text, ttsLang);
            }
        }

        function fallbackSpeak(text, lang) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = lang;
            msg.rate = 0.9;
            msg.pitch = 1.1;
            speechSynthesis.cancel();
            speechSynthesis.speak(msg);
        }

        // Mở khóa âm thanh Google TTS cho thiết bị di động khi chạm lần đầu
        function initAudioUnlock() {
            if (!ttsAudio) ttsAudio = document.getElementById('ttsAudio');
            if (ttsAudio) {
                ttsAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
                ttsAudio.play().catch(e => {});
            }
        }
        
        document.addEventListener('click', initAudioUnlock, { once: true });
        document.addEventListener('touchstart', initAudioUnlock, { once: true });

        const swiper = new Swiper('.swiper', {
            direction: 'vertical',
            mousewheel: true
        })

        swiper.on('slideChange', () => {

            const word = vocab[swiper.activeIndex]
            speak(word.en, 'en')

        })

    </script>

</body>

</html>
