<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thẻ Flashcard Song Ngữ Cho Bé 🐼 - Sunny Panda</title>
    <link rel="stylesheet" href="css/app.css">
    <style>
        .fc-page-container {
            max-width: 650px;
            margin: 20px auto 40px auto;
            padding: 0 15px;
        }

        .theme-selector-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: none;
        }

        .theme-selector-chips::-webkit-scrollbar {
            display: none;
        }

        .theme-chip {
            padding: 8px 16px;
            background: white;
            border-radius: 20px;
            border: 2px solid #CBD5E1;
            font-size: 0.95rem;
            font-weight: 800;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 3px 0 #CBD5E1;
            transition: all 0.15s ease;
        }

        .theme-chip.active {
            background: #2ED573;
            color: white;
            border-color: #26AF61;
            box-shadow: 0 3px 0 #26AF61;
        }
    </style>
</head>

<body>

    <header class="app-navbar">
        <a href="index.html" class="brand-badge" style="text-decoration:none;">
            <div class="brand-logo-icon">🐼</div>
            <div class="brand-text">
                <h1>Thẻ Học Song Ngữ</h1>
                <span>Flashcards Thông Minh</span>
            </div>
        </a>

        <div class="nav-actions">
            <a href="conversation.html" class="btn-header" style="text-decoration:none; background:#FF9F45; color:white; border-color:#E67E22;" title="Học câu giao tiếp">
                💬 Giao Tiếp
            </a>
            <a href="index.html" class="btn-header" style="text-decoration:none;">
                🏠 Trang Chủ
            </a>
        </div>
    </header>

    <audio id="masterAudio" preload="auto"></audio>

    <div class="fc-page-container">
        <!-- Topic Filter Chips -->
        <div class="theme-selector-chips" id="theme-chips"></div>

        <!-- Flashcard Area -->
        <div class="game-area" id="game-area" style="display:block;"></div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/mascot.js"></script>
    <script src="js/gestures.js"></script>
    <script src="js/games.js"></script>
    <script src="js/app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Render theme chips
            const chips = document.getElementById('theme-chips');
            if (chips) {
                let html = '<button class="theme-chip active" onclick="switchTheme(\'animals\', this)">🐼 Động Vật</button>';
                html += '<button class="theme-chip" onclick="switchTheme(\'fruits\', this)">🍎 Hoa Quả</button>';
                html += '<button class="theme-chip" onclick="switchTheme(\'vehicles\', this)">🚗 Xe Cộ</button>';
                html += '<button class="theme-chip" onclick="switchTheme(\'colors\', this)">🎨 Màu Sắc</button>';
                html += '<button class="theme-chip" onclick="switchTheme(\'alphabet\', this)">🔤 Chữ Cái</button>';
                html += '<button class="theme-chip" onclick="switchTheme(\'numbers\', this)">🔢 Đếm Số</button>';
                chips.innerHTML = html;
            }

            const launch = () => {
                const app = window.sunnyApp || (typeof sunnyApp !== 'undefined' ? sunnyApp : null);
                if (app && app.games) {
                    app.games.startFlashcards('animals');
                } else {
                    setTimeout(launch, 100);
                }
            };
            launch();
        });

        function switchTheme(catKey, elem) {
            document.querySelectorAll('.theme-chip').forEach(c => c.classList.remove('active'));
            if (elem) elem.classList.add('active');
            const app = window.sunnyApp || (typeof sunnyApp !== 'undefined' ? sunnyApp : null);
            if (app && app.games) {
                app.games.startFlashcards(catKey);
            }
        }
    </script>
</body>

</html>
