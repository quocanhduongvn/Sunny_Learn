<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bé học số - Tương tác từng chữ</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            box-sizing: border-box;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 320px;
        }

        .control-btn,
        .lang-select {
            padding: 10px;
            font-size: 1rem;
            border-radius: 10px;
            border: 2px solid #3498db;
            background-color: white;
            cursor: pointer;
            font-weight: bold;
            color: #2c3e50;
            flex: 1;
            text-align: center;
            outline: none;
            font-family: inherit;
        }

        .control-btn:active {
            background-color: #f1f2f6;
        }

        .instruction {
            color: #95a5a6;
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
        }

        /* Khu vực các nút chữ số */
        .word-container {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: nowrap;
            justify-content: center;
            width: 100%;
            max-width: 100%;
        }

        .word-btn {
            background: white;
            border: 2px solid #3498db;
            color: #3498db;
            padding: 8px 4px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            flex: 1 1 0;
            min-width: 0;
            word-break: break-word;
            text-align: center;
        }

        .word-btn:active {
            transform: scale(0.9);
            background-color: #3498db;
            color: white;
        }

        .word-btn span {
            font-size: 0.8rem;
        }

        /* Icon loa nhỏ */

        /* Khu vực hiển thị số đã bấm */
        .input-slots {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            flex-wrap: nowrap;
            justify-content: center;
            width: 100%;
        }

        .slot {
            width: 50px;
            height: 55px;
            border-bottom: 5px solid #bdc3c7;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2c3e50;
            flex: 0 1 50px;
        }

        .correct {
            color: #2ecc71 !important;
            border-bottom-color: #2ecc71 !important;
        }

        .wrong {
            color: #e74c3c !important;
            border-bottom-color: #e74c3c !important;
        }

        /* Bàn phím số */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }

        .keypad button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.5rem;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 5px #2980b9;
            font-weight: bold;
        }

        .keypad button:active {
            box-shadow: 0 0 #2980b9;
            transform: translateY(4px);
        }

        .btn-reset {
            background-color: #f1c40f !important;
            box-shadow: 0 5px #f39c12 !important;
        }

        .speak-all-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.1rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 4px #27ae60;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .speak-all-btn:active {
            box-shadow: 0 0 #27ae60;
            transform: translateY(4px);
        }

        .version-label {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 0.8rem;
            color: #7f8c8d;
            background: rgba(255, 255, 255, 0.8);
            padding: 2px 5px;
            border-radius: 4px;
            pointer-events: none;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>

<body>
    <div id="overlay"
        style="position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(52, 152, 219, 0.9); z-index:1000; display:flex; align-items:center; justify-content:center; flex-direction:column; color:white;">
        <h1 style="margin-bottom:20px;">Bé Học Số</h1>
        <button onclick="startApp()"
            style="padding: 20px 40px; font-size: 1.5rem; border-radius: 50px; border:none; background:#2ecc71; color:white; font-weight:bold; cursor:pointer; box-shadow: 0 10px #27ae60;">
            NHẤN ĐỂ BẮT ĐẦU ▶️
        </button>
    </div>

    <!-- Màn hình chúc mừng -->
    <div id="congrat-overlay"
        style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0, 0, 0, 0.85); z-index:2000; align-items:center; justify-content:center; flex-direction:column; color:white;">
        <div style="font-size: 100px; margin-bottom: 20px; animation: bounce 1s infinite;">🎉🏅🎉</div>
        <h1 id="congrat-msg"
            style="color: #f1c40f; text-shadow: 0 0 10px #f39c12; font-size: 2.5rem; text-align: center;">Chúc mừng bé!
        </h1>
        <button onclick="nextLesson()"
            style="margin-top: 30px; padding: 15px 35px; font-size: 1.5rem; border-radius: 25px; border:none; background:#e74c3c; color:white; font-weight:bold; cursor:pointer; box-shadow: 0 8px #c0392b;">
            Chơi tiếp ▶️
        </button>
    </div>

    <!-- Nút chuyển sang trang FlashCard -->
    <div style="width: 100%; max-width: 320px; display: flex; justify-content: flex-end; margin-bottom: 15px;">
        <a href="flashCard.html"
            style="background: #9b59b6; color: white; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; box-shadow: 0 4px #8e44ad; font-size: 1.1rem; display: flex; align-items: center; gap: 5px;">
            🐯 Thẻ Từ Vựng ▶️
        </a>
    </div>

    <div class="controls">
        <button onclick="generateRandomLesson()" class="control-btn">🎲 Random Số</button>
        <select id="lang-select" onchange="changeLanguage()" class="lang-select">
            <option value="en">English</option>
            <option value="vi">Tiếng Việt</option>
        </select>
    </div>

    <div class="instruction">NHẤN VÀO CHỮ ĐỂ NGHE:</div>


    <button onclick="speakAllNumbers()" class="speak-all-btn">🔊 ĐỌC CẢ 4 SỐ</button>

    <div class="word-container" id="word-container">
        <!-- Will be generated by JS -->
    </div>

    <div class="input-slots" id="input-slots">
        <!-- Will be generated by JS -->
    </div>

    <div class="keypad">
        <button onclick="press(1)">1</button>
        <button onclick="press(2)">2</button>
        <button onclick="press(3)">3</button>
        <button onclick="press(4)">4</button>
        <button onclick="press(5)">5</button>
        <button onclick="press(6)">6</button>
        <button onclick="press(7)">7</button>
        <button onclick="press(8)">8</button>
        <button onclick="press(9)">9</button>
        <div style="visibility: hidden;"></div>
        <button onclick="press(0)">0</button>
        <button class="btn-reset" onclick="reset()">✕</button>
        <audio id="ttsAudio"></audio>

        <script>
            const numWords = {
                'en': ['Zero', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'],
                'vi': ['Không', 'Một', 'Hai', 'Ba', 'Bốn', 'Năm', 'Sáu', 'Bảy', 'Tám', 'Chín']
            };

            let currentLanguage = 'en';
            let targetNumbers = [];
            let currentIndex = 0;
            let ttsAudio;
            const soundMap = {
                0: 'sound/Zero.mp3',
                1: 'sound/One.mp3',
                2: 'sound/Two.mp3',
                3: 'sound/Three.mp3',
                4: 'sound/Four.mp3',
                5: 'sound/Five.mp3',
                6: 'sound/Six.mp3',
                7: 'sound/Seven.mp3',
                8: 'sound/Eight.mp3',
                9: 'sound/Nine.mp3'
            };
            const speechSupported = 'speechSynthesis' in window;

            function fallbackSpeakText(text, langCode) {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = langCode;
                    utterance.volume = 1;
                    utterance.rate = 1;
                    utterance.pitch = 1;
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.speak(utterance);
                }
            }

            function speakText(text) {
                if (!ttsAudio) ttsAudio = document.getElementById('ttsAudio');

                const lang = document.getElementById('lang-select').value;
                const gLang = lang === 'en' ? 'en' : 'vi'; // Google TTS code
                const fallbackLang = lang === 'en' ? 'en-US' : 'vi-VN'; // Web Speech API code

                if (ttsAudio) {
                    const url = `https://translate.googleapis.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${gLang}&q=${encodeURIComponent(text)}`;
                    ttsAudio.src = url;
                    ttsAudio.play().catch(e => {
                        console.log("Audio play failed, using fallback:", e);
                        fallbackSpeakText(text, fallbackLang);
                    });
                } else {
                    fallbackSpeakText(text, fallbackLang);
                }
            }

            function playAudioForNumber(num) {
                const audioSrc = soundMap[num];
                if (audioSrc && ttsAudio) {
                    ttsAudio.src = audioSrc;
                    ttsAudio.play().catch(err => {
                        console.error('Audio file play error:', err);
                        speakText(numWords[currentLanguage][num]);
                    });
                    return;
                }
                speakText(numWords[currentLanguage][num]);
            }

            function speakNum(num) {
                playAudioForNumber(num);
            }

            function speakAllNumbers() {
                if (!ttsAudio) {
                    speakText(targetNumbers.map(num => numWords[currentLanguage][num]).join(' '));
                    return;
                }

                const sequence = targetNumbers.filter(num => soundMap[num]);
                if (sequence.length === 0) {
                    speakText(targetNumbers.map(num => numWords[currentLanguage][num]).join(' '));
                    return;
                }

                let index = 0;
                ttsAudio.onended = () => {
                    index += 1;
                    if (index < sequence.length) {
                        ttsAudio.src = soundMap[sequence[index]];
                        ttsAudio.play().catch(err => {
                            console.error('Audio sequence error:', err);
                            speakText(targetNumbers.map(num => numWords[currentLanguage][num]).join(' '));
                        });
                    }
                };

                ttsAudio.src = soundMap[sequence[index]];
                ttsAudio.play().catch(err => {
                    console.error('Audio sequence start error:', err);
                    speakText(targetNumbers.map(num => numWords[currentLanguage][num]).join(' '));
                });
            }

            // Hàm khởi tạo sau khi bé nhấn nút Bắt đầu
            function startApp() {
                document.getElementById('overlay').style.display = 'none'; // Ẩn màn hình chờ

                ttsAudio = document.getElementById('ttsAudio');
                if (ttsAudio) {
                    ttsAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
                    ttsAudio.play().catch(e => {
                        console.warn("Silent unlock failed:", e);
                    });
                }

                setTimeout(() => {
                    speakText(currentLanguage === 'vi' ? 'Chào bé' : 'Hello');
                }, 300);

                generateRandomLesson();
            }

            function changeLanguage() {
                currentLanguage = document.getElementById('lang-select').value;
                renderWords();
            }

            function renderWords() {
                const wordContainer = document.getElementById('word-container');
                wordContainer.innerHTML = targetNumbers.map(num => {
                    const word = numWords[currentLanguage][num];
                    return `<button class="word-btn" onclick="speakNum(${num})">${word.toUpperCase()} <span>🔊</span></button>`;
                }).join('');
            }

            function generateRandomLesson() {
                targetNumbers = Array.from({ length: 4 }, () => Math.floor(Math.random() * 10));
                currentIndex = 0;
                renderWords();

                const inputSlots = document.getElementById('input-slots');
                inputSlots.innerHTML = targetNumbers.map((_, i) => `<div class="slot" id="slot-${i}"></div>`).join('');
            }

            function press(num) {
                if (currentIndex >= targetNumbers.length) return;
                const currentSlot = document.getElementById(`slot-${currentIndex}`);
                currentSlot.innerText = num;

                if (num === targetNumbers[currentIndex]) {
                    currentSlot.classList.add('correct');
                    speakNum(num);
                } else {
                    currentSlot.classList.add('wrong');
                }
                currentIndex++;

                if (currentIndex === targetNumbers.length) {
                    checkWinCondition();
                }
            }

            function checkWinCondition() {
                let allCorrect = true;
                for (let i = 0; i < targetNumbers.length; i++) {
                    const slot = document.getElementById(`slot-${i}`);
                    if (!slot.classList.contains('correct')) {
                        allCorrect = false;
                        break;
                    }
                }

                if (allCorrect) {
                    setTimeout(() => {
                        const overlay = document.getElementById('congrat-overlay');
                        const msg = document.getElementById('congrat-msg');
                        msg.innerText = currentLanguage === 'vi' ? 'Tuyệt vời!' : 'Excellent!';
                        overlay.style.display = 'flex';
                        speakText(currentLanguage === 'vi' ? 'Chúc mừng bé!' : 'Congratulations!');
                    }, 800);
                }
            }

            function nextLesson() {
                document.getElementById('congrat-overlay').style.display = 'none';
                generateRandomLesson();
            }

            function reset() {
                if (currentIndex > 0) {
                    currentIndex--;
                    const slot = document.getElementById(`slot-${currentIndex}`);
                    slot.innerText = "";
                    slot.classList.remove('correct', 'wrong');
                }
            }
        </script>

        <div class="version-label" id="debug-version">V26.003 (FlashCard)</div>
</body>

</html>
