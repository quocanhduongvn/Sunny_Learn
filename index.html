<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bé học số - Tương tác từng chữ</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            box-sizing: border-box;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 320px;
        }

        .control-btn,
        .lang-select {
            padding: 10px;
            font-size: 1rem;
            border-radius: 10px;
            border: 2px solid #3498db;
            background-color: white;
            cursor: pointer;
            font-weight: bold;
            color: #2c3e50;
            flex: 1;
            text-align: center;
            outline: none;
            font-family: inherit;
        }

        .control-btn:active {
            background-color: #f1f2f6;
        }

        .instruction {
            color: #95a5a6;
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
        }

        /* Khu vực các nút chữ số */
        .word-container {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: nowrap;
            justify-content: center;
            width: 100%;
            max-width: 100%;
        }

        .word-btn {
            background: white;
            border: 2px solid #3498db;
            color: #3498db;
            padding: 8px 4px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            flex: 1 1 0;
            min-width: 0;
            word-break: break-word;
            text-align: center;
        }

        .word-btn:active {
            transform: scale(0.9);
            background-color: #3498db;
            color: white;
        }

        .word-btn span {
            font-size: 0.8rem;
        }

        /* Icon loa nhỏ */

        /* Khu vực hiển thị số đã bấm */
        .input-slots {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            flex-wrap: nowrap;
            justify-content: center;
            width: 100%;
        }

        .slot {
            width: 50px;
            height: 55px;
            border-bottom: 5px solid #bdc3c7;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2c3e50;
            flex: 0 1 50px;
        }

        .correct {
            color: #2ecc71 !important;
            border-bottom-color: #2ecc71 !important;
        }

        .wrong {
            color: #e74c3c !important;
            border-bottom-color: #e74c3c !important;
        }

        /* Bàn phím số */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }

        .keypad button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.5rem;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 5px #2980b9;
            font-weight: bold;
        }

        .keypad button:active {
            box-shadow: 0 0 #2980b9;
            transform: translateY(4px);
        }

        .btn-reset {
            background-color: #f1c40f !important;
            box-shadow: 0 5px #f39c12 !important;
        }

        .speak-all-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.1rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 4px #27ae60;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .speak-all-btn:active {
            box-shadow: 0 0 #27ae60;
            transform: translateY(4px);
        }
    </style>
</head>

<body>

    <div class="controls">
        <button onclick="generateRandomLesson()" class="control-btn">🎲 Random Số</button>
        <select id="lang-select" onchange="changeLanguage()" class="lang-select">
            <option value="en">English</option>
            <option value="vi">Tiếng Việt</option>
        </select>
    </div>

    <div class="instruction">NHẤN VÀO CHỮ ĐỂ NGHE:</div>

    <button onclick="speakAllNumbers()" class="speak-all-btn">🔊 ĐỌC CẢ 4 SỐ</button>

    <div class="word-container" id="word-container">
        <!-- Will be generated by JS -->
    </div>

    <div class="input-slots" id="input-slots">
        <!-- Will be generated by JS -->
    </div>

    <div class="keypad">
        <button onclick="press(1)">1</button>
        <button onclick="press(2)">2</button>
        <button onclick="press(3)">3</button>
        <button onclick="press(4)">4</button>
        <button onclick="press(5)">5</button>
        <button onclick="press(6)">6</button>
        <button onclick="press(7)">7</button>
        <button onclick="press(8)">8</button>
        <button onclick="press(9)">9</button>
        <div style="visibility: hidden;"></div>
        <button onclick="press(0)">0</button>
        <button class="btn-reset" onclick="reset()">✕</button>
    </div>

    <script>
        const numWords = {
            'en': ['Zero', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'],
            'vi': ['Không', 'Một', 'Hai', 'Ba', 'Bốn', 'Năm', 'Sáu', 'Bảy', 'Tám', 'Chín']
        };

        let currentLanguage = 'en';
        let targetNumbers = [];
        let currentIndex = 0;

        function speakNum(num) {
            const word = numWords[currentLanguage][num];
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = currentLanguage === 'vi' ? 'vi-VN' : 'en-US';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        function speakAllNumbers() {
            // Joined by commas so the Voice Synthesizer naturally pauses between numbers
            const words = targetNumbers.map(num => numWords[currentLanguage][num]).join(', ');
            const utterance = new SpeechSynthesisUtterance(words);
            utterance.lang = currentLanguage === 'vi' ? 'vi-VN' : 'en-US';
            utterance.rate = 0.7; // Slightly slower
            window.speechSynthesis.speak(utterance);
        }

        function changeLanguage() {
            currentLanguage = document.getElementById('lang-select').value;
            // Update button texts without resetting the current progress
            const wordContainer = document.getElementById('word-container');
            wordContainer.innerHTML = targetNumbers.map(num => {
                const word = numWords[currentLanguage][num];
                return `<button class="word-btn" onclick="speakNum(${num})">${word.toUpperCase()} <span>🔊</span></button>`;
            }).join('');
        }

        function generateRandomLesson() {
            const length = 4; // Sinh ra 4 số ngẫu nhiên
            const newTarget = [];
            for (let i = 0; i < length; i++) {
                newTarget.push(Math.floor(Math.random() * 10));
            }
            targetNumbers = newTarget;
            currentIndex = 0;

            changeLanguage(); // Render text for the words based on current language

            // Render input slots
            const inputSlots = document.getElementById('input-slots');
            inputSlots.innerHTML = targetNumbers.map((_, i) =>
                `<div class="slot" id="slot-${i}"></div>`
            ).join('');
        }

        function press(num) {
            if (currentIndex >= targetNumbers.length) return;

            const currentSlot = document.getElementById(`slot-${currentIndex}`);
            currentSlot.innerText = num;

            if (num === targetNumbers[currentIndex]) {
                currentSlot.classList.add('correct');
                // Nếu đúng, tự động đọc số đó
                speakNum(num);
            } else {
                currentSlot.classList.add('wrong');
            }

            currentIndex++;
        }

        function reset() {
            // Function to delete the last entered digit
            if (currentIndex > 0) {
                currentIndex--;
                const slot = document.getElementById(`slot-${currentIndex}`);
                slot.innerText = "";
                slot.classList.remove('correct', 'wrong');
            }
        }

        // Khởi tạo bài học đầu tiên khi trang load
        window.onload = () => {
            generateRandomLesson();
        };
    </script>
</body>

</html>
